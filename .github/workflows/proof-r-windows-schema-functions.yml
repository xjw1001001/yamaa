name: Inspect original Windows R conformance mismatch

on:
  push:
    branches: [proof/r-windows-schema-functions-38544446840]

permissions:
  contents: read
  actions: read

defaults:
  run:
    shell: bash

jobs:
  reproduce-original-helper:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ae799a5e96cb97c94dc123324e339616e36f769e
          persist-credentials: false
      - uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2
        with:
          r-version: '4.6.1'
      - name: Reproduce original SDK callback on actual Windows R
        shell: Rscript {0}
        run: |
          source("rust/tests/project-programs/r/R/functions.R")
          cat("R version:", R.version.string, "platform:", R.version$platform, "\n")
          value <- 2 / 400
          bits <- paste(sprintf("%02x", as.integer(rev(writeBin(value, raw(), size=8L,
                                                               endian="little")))), collapse="")
          stopifnot(identical(bits, "3f747ae147ae147b"))
          cat("Original quotient binary64 bits:", bits, "\n")
          cat("Original sprintf %.2f:", sprintf("%.2f", value), "\n")
          for (sample in list(c(2,400,2,0.01), c(-2,400,2,-0.01),
                              c(25,100,1,0.2), c(5,4,1,1.2))) {
            actual <- project_ratio(sample[1],sample[2],as.integer(sample[3]),0,FALSE)
            cat("Original helper args:", sample[1:3], "actual:", actual,
                "authored expected:", sample[4], "equal:", identical(actual,sample[4]), "\n")
          }
          cat("Direct original-helper reproduction only; not installed facade or release qualification\n")
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 5cfcffe919f27e72acbb0b10444110b23fd52458
          path: repair-source
          persist-credentials: false
      - name: Install the declared private R checkpoint codec
        shell: Rscript {0}
        run: |
          private <- file.path(Sys.getenv("RUNNER_TEMP"), "checkpoint-jsonlite-library")
          dir.create(private, recursive=TRUE, showWarnings=FALSE)
          package <- tempfile(fileext=".tar.gz")
          download.file("https://cran.r-project.org/src/contrib/Archive/jsonlite/jsonlite_2.0.0.tar.gz",
                        package, mode="wb", quiet=TRUE)
          install.packages(package, repos=NULL, type="source", lib=private)
          stopifnot(as.character(utils::packageVersion("jsonlite", lib.loc=private)) == "2.0.0")
          cat(paste0("R_LIBS_USER=",private,"\n"), file=Sys.getenv("GITHUB_ENV"), append=TRUE)
          cat("Actual private checkpoint codec:", private, "jsonlite2.0.0\n")
      - name: Verify all three actual R checkpoint controls on repair source
        run: |
          python - <<'PY'
          import sys
          import unittest
          print('Actual checkpoint source5cfcffe9; interpreter', sys.version)
          suite = unittest.defaultTestLoader.discover(
              'repair-source/rust/tests', pattern='test_public_lifecycle_view_retention.py')
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          assert result.testsRun == 3 and not result.skipped, 'Actual R controls may not skip'
          raise SystemExit(not result.wasSuccessful())
          PY
  inspect-original:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Admit the exact original artifact and producing job
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/11883757873" > original-artifact.json
          gh api "repos/${GITHUB_REPOSITORY}/actions/jobs/115787138907" > original-job.json
          python - <<'PY'
          import datetime
          import json
          from pathlib import Path
          artifact = json.loads(Path('original-artifact.json').read_bytes())
          job = json.loads(Path('original-job.json').read_bytes())
          source = 'ae799a5e96cb97c94dc123324e339616e36f769e'
          assert artifact['id'] == 11883757873
          assert artifact['name'] == 'public-conformance-r-windows-latest'
          assert artifact['size_in_bytes'] == 701010 and artifact['expired'] is False
          assert artifact['workflow_run']['id'] == 38544446840
          assert artifact['workflow_run']['head_sha'] == source
          assert job['id'] == 115787138907 and job['run_id'] == 38544446840
          assert job['head_sha'] == source and job['name'] == 'native-r (windows-latest)'
          assert job['status'] == 'completed' and job['conclusion'] == 'failure'
          parse = lambda text: datetime.datetime.fromisoformat(text.replace('Z', '+00:00'))
          assert parse(job['started_at']) <= parse(artifact['created_at']) <= parse(job['completed_at'])
          print('Admitted original artifact ID/run/job/source and producing interval; diagnostic only')
          PY
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ae799a5e96cb97c94dc123324e339616e36f769e
          path: original-source
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: '11883757873'
          run-id: 38544446840
          github-token: ${{ github.token }}
          path: original-conformance
          merge-multiple: true
      - name: Read original case observations without executing either runtime
        run: |
          python - <<'PY' | tee original-mismatch-observations.txt
          import json
          from pathlib import Path
          root = Path('original-conformance')
          expected = Path('original-source/benchmarks/schema-functions/expected/test.csv').read_bytes()
          print('ORIGINAL AUTHORED EXPECTED CSV', json.dumps(expected.decode('utf-8'), ensure_ascii=True))
          matched = []
          for path in sorted(root.rglob('*')):
              if not path.is_file():
                  continue
              relative = str(path.relative_to(root))
              if 'schema-functions' in relative:
                  matched.append(relative)
                  if path.suffix.lower() in ('.csv', '.json', '.txt', '.yaml', '.yml'):
                      data = path.read_bytes()
                      assert len(data) < 1000000
                      print('ORIGINAL CASE MEMBER', relative, json.dumps(data.decode('utf-8'), ensure_ascii=True))
              elif path.suffix == '.json':
                  try:
                      value = json.loads(path.read_bytes())
                  except (ValueError, UnicodeError):
                      continue
                  def inspect(value, location):
                      if isinstance(value, dict):
                          if 'schema-functions' in value.values():
                              print('ORIGINAL CASE RECORD', relative, location, json.dumps(value, ensure_ascii=True))
                          for key, child in value.items():
                              inspect(child, location + '/' + key)
                      elif isinstance(value, list):
                          for index, child in enumerate(value):
                              inspect(child, location + '/' + str(index))
                  inspect(value, '$')
          assert matched, 'No original schema-functions case members retained'
          print('CASE MEMBER INVENTORY', json.dumps(matched))
          print('No candidate was executed; no expected/raw bytes were changed; this is not qualification')
          PY
      - name: Preserve diagnostic observations and admitted original member bytes
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: original-windows-r-schema-functions-inspection
          path: |
            original-artifact.json
            original-job.json
            original-mismatch-observations.txt
            original-conformance
          if-no-files-found: error
          overwrite: false
