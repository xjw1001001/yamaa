name: Superseded migration native queue maintenance

on:
  push:
    branches: ['coordination/issue-1969-native-queue']

permissions:
  contents: read
  actions: write

jobs:
  cancel-reviewed-superseded-runs:
    if: github.repository == 'elong0527/yamaa'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Preserve exact original metadata before cancelling superseded work
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python - <<'PY'
          import json, subprocess
          from pathlib import Path
          reviewed = [{"id":38528013135,"sha":"ab6f9e2d6397a14eba042fc7a4cd477bac769c7f","branch":"main","reason":"superseded incomplete intermediate main; reviewed resource correction is merged in its descendant and has a separate completed 97-lane qualification; preserve original jobs/artifacts and free current-main concurrency without accepting this canceled run"}]
          repository = 'elong0527/yamaa'
          root = Path('superseded-native-records')
          root.mkdir()
          def api(endpoint, *arguments):
              return json.loads(subprocess.check_output(
                  ['gh', 'api', endpoint, *arguments], text=True))
          def retained(value):
              if isinstance(value, dict):
                  return {k: retained(v) for k,v in value.items() if k != 'digest'}
              if isinstance(value, list):
                  return [retained(v) for v in value]
              return value
          def save(path, value):
              path.write_text(json.dumps(retained(value), indent=2) + '\n')
          current_sha = 'cc232323d4b2c9930378ea5a0a61345eaafc9310'
          current_run_id = 38536875427
          current = api(f'repos/{repository}/branches/main')
          save(root/'reviewed-current-main.json', current)
          assert current['commit']['sha'] == current_sha
          replacement = api(f'repos/{repository}/actions/runs/{current_run_id}')
          save(root/'reviewed-current-main-run.json', replacement)
          assert replacement['head_sha'] == current_sha
          assert replacement['head_branch'] == 'main'
          assert replacement['event'] == 'push'
          assert replacement['path'] == '.github/workflows/native.yml'
          assert replacement['repository']['full_name'] == repository
          assert replacement['head_repository']['full_name'] == repository
          ancestry = api(f'repos/{repository}/compare/{reviewed[0]["sha"]}...{current_sha}')
          save(root/'reviewed-main-ancestry.json', ancestry)
          assert ancestry['status'] == 'ahead'
          assert ancestry['merge_base_commit']['sha'] == reviewed[0]['sha']
          for approved in reviewed:
              prefix = f"repos/{repository}/actions/runs/{approved['id']}"
              run = api(prefix)
              directory = root / str(approved['id'])
              directory.mkdir()
              save(directory/'before-run.json', run)
              assert run['id'] == approved['id']
              assert run['head_sha'] == approved['sha']
              assert run['head_branch'] == approved['branch']
              assert run['path'] == '.github/workflows/native.yml'
              assert run['repository']['full_name'] == repository
              assert run['head_repository']['full_name'] == repository
              save(directory/'original-jobs.json', api(
                  prefix + f"/attempts/{run['run_attempt']}/jobs?per_page=100",
                  '--paginate', '--slurp'))
              save(directory/'original-artifacts.json', api(
                  prefix + '/artifacts?per_page=100', '--paginate', '--slurp'))
              if run['status'] != 'completed':
                  assert run['status'] in ('queued', 'pending', 'in_progress', 'waiting', 'requested')
                  subprocess.run(['gh', 'api', '--method', 'POST', prefix+'/cancel'], check=True)
              save(directory/'after-run.json', api(prefix))
          PY
      - name: Retain original failures, identities and cancellation receipts
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        with:
          name: superseded-migration-native-records
          path: superseded-native-records
          retention-days: 90
          if-no-files-found: error

