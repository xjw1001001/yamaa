name: Retain reviewed rollback assets in existing drafts

on:
  push:
    branches: [migration/rollback-draft-retention]

permissions: {}

jobs:
  retain-reviewed-assets:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Verify reviewed source, package and fresh-install receipt identities
        run: python .rollback-retention/retain.py --check
      - name: Upload exact allowlisted bytes to the existing unpublished drafts
        env:
          GH_TOKEN: ${{ github.token }}
        run: python .rollback-retention/retain.py --upload --output "${RUNNER_TEMP}/rollback-draft-retrieval.json"
      - name: Preserve authenticated exact-byte retrieval receipt
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: rollback-draft-retrieval
          path: ${{ runner.temp }}/rollback-draft-retrieval.json
          if-no-files-found: warn
